<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCine - Catálogo de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎬 CineCine</h1>
        <p>Seu gerenciador pessoal de streaming</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Cadastrar Novo Filme</h2>
            <form id="movieForm">
                <div class="input-group">
                    <label for="title">Título do Filme</label>
                    <input type="text" id="title" placeholder="Ex: Inception" required>
                </div>
                <div class="input-group">
                    <label for="genre">Gênero</label>
                    <input type="text" id="genre" placeholder="Ex: Ação / Suspense" required>
                </div>
                <button type="submit">Adicionar à Lista</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Filmes Disponíveis</h2>
            <ul id="movieList">
                </ul>
        </section>
    </main>

    <footer>
        <p>Desenvolvido por: Júlia das Neves, Alexandre Brito, Fredson Rafael, Murilo de Assis, Luma Barbosa</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
